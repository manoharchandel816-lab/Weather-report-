name: Daily Weather Bot

on:
  schedule:
    - cron: '30 2 * * *' # भारतीय समयानुसार सुबह 8:00 बजे (UTC सुबह 2:30 बजे)
  workflow_dispatch: # इससे आप चाहें तो GitHub पर जाकर तुरंत बटन दबाकर भी टेस्ट कर सकते हैं

jobs:
  run-weather-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests twilio

      - name: Run weather script
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: |
          python weather.py
          
